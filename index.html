<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Keyboard</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
      }
      img {
        max-width: 90vw;
        max-height: 90vh;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        animation: figure-eight 6s linear infinite;
      }
      @keyframes figure-eight {
        0%, 50%, 100% { transform: translate(0, 0); }
        6.25% { transform: translate(9.18px, 5.66px); }
        12.5% { transform: translate(16.97px, 8px); }
        18.75% { transform: translate(22.17px, 5.66px); }
        25% { transform: translate(24px, 0); }
        31.25% { transform: translate(22.17px, -5.66px); }
        37.5% { transform: translate(16.97px, -8px); }
        43.75% { transform: translate(9.18px, -5.66px); }
        56.25% { transform: translate(-9.18px, 5.66px); }
        62.5% { transform: translate(-16.97px, 8px); }
        68.75% { transform: translate(-22.17px, 5.66px); }
        75% { transform: translate(-24px, 0); }
        81.25% { transform: translate(-22.17px, -5.66px); }
        87.5% { transform: translate(-16.97px, -8px); }
        93.75% { transform: translate(-9.18px, -5.66px); }
      }
      @media (prefers-reduced-motion: reduce) {
        img { animation: none; }
      }
      #character-rain {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <img src="IMG_2847.JPG"/>
    <canvas id="character-rain" aria-hidden="true"></canvas>
    <script>
      const canvas = document.getElementById('character-rain');
      const context = canvas.getContext('2d');
      const characters = ['tmcds1.png', 'tmcds2.png'].map((src) => {
        const image = new Image();
        image.src = src;
        return image;
      });
      const drops = [];
      let width;
      let height;
      let frame = null;
      let previousTime = 0;
      let held = false;
      let spawnBudget = 0;

      function resizeRain() {
        width = window.innerWidth;
        height = window.innerHeight;
        const scale = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        context.setTransform(scale, 0, 0, scale, 0, 0);
      }

      function animateRain(time) {
        const elapsed = Math.min((time - previousTime) / 1000, 0.05);
        previousTime = time;
        context.clearRect(0, 0, width, height);

        if (held) {
          spawnBudget += elapsed * 450;
          const count = Math.floor(spawnBudget);
          spawnBudget -= count;
          for (let i = 0; i < count && drops.length < 1200; i++) {
            const size = 18 + Math.random() * 18;
            drops.push({
              image: characters[Math.floor(Math.random() * characters.length)],
              x: Math.random() * width,
              y: -size,
              size,
              speed: 500 + Math.random() * 600,
              drift: (Math.random() - 0.5) * 140,
              angle: Math.random() * Math.PI * 2,
              spin: (Math.random() - 0.5) * 5,
            });
          }
        }

        for (let i = drops.length - 1; i >= 0; i--) {
          const drop = drops[i];
          drop.y += drop.speed * elapsed;
          drop.x += drop.drift * elapsed;
          drop.angle += drop.spin * elapsed;
          if (drop.y > height + drop.size) {
            drops.splice(i, 1);
            continue;
          }
          if (!drop.image.complete || !drop.image.naturalWidth) continue;
          context.save();
          context.translate(drop.x, drop.y);
          context.rotate(drop.angle);
          context.drawImage(drop.image, -drop.size / 2, -drop.size / 2,
            drop.size, drop.size);
          context.restore();
        }

        if (held || drops.length) {
          frame = requestAnimationFrame(animateRain);
        } else {
          frame = null;
          spawnBudget = 0;
        }
      }

      function isAltGr(event) {
        return event.key === 'AltGraph' || event.code === 'AltRight';
      }

      window.addEventListener('keydown', (event) => {
        if (!isAltGr(event)) return;
        held = true;
        if (event.repeat) return;
        const now = performance.now();
        if (frame === null) {
          previousTime = now;
          spawnBudget = 30;
          frame = requestAnimationFrame(animateRain);
        }
      });
      window.addEventListener('keyup', (event) => {
        if (isAltGr(event)) {
          held = false;
          spawnBudget = 0;
        }
      });

      function stopRain() {
        held = false;
        drops.length = 0;
        spawnBudget = 0;
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        context.clearRect(0, 0, width, height);
      }

      window.addEventListener('blur', stopRain);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopRain();
      });
      window.addEventListener('resize', resizeRain);
      resizeRain();
    </script>
  </body>
</html>
